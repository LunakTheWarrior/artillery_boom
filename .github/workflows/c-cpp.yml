name: Bazel firmware build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 curl xz-utils

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # Bazel downloads the checksum-pinned Arm GNU Toolchain 15.2.Rel1.
      - name: Build firmware and drivers
        run: bazel build //... --lockfile_mode=error

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pico2-w-firmware
          path: |
            bazel-bin/light_turret.uf2
            bazel-bin/light_turret.elf
            bazel-bin/light_turret.bin
          if-no-files-found: error
