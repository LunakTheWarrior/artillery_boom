name: Bazel firmware build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Host tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 curl xz-utils

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Run host tests
        run: bazel test //tests/... //team_rocket_buzzer:button_test //book_openener:control_test //book_openener:driver_parity_test --platforms=@platforms//host --lockfile_mode=error --test_output=errors

  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 curl xz-utils

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # Bazel downloads the checksum-pinned Arm GNU Toolchain 15.2.Rel1.
      - name: Build firmware and drivers
        run: bazel build //... --lockfile_mode=error

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pico2-w-firmware
          path: |
            bazel-bin/light_turret.uf2
            bazel-bin/light_turret.elf
            bazel-bin/light_turret.bin
            bazel-bin/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

      - name: Upload book opener firmware and printable parts
        uses: actions/upload-artifact@v4
        with:
          name: book-openener-uno
          path: |
            bazel-bin/book_openener/book_openener.hex
            bazel-bin/book_openener/book_openener.elf
            bazel-bin/book_openener/book_openener.map
            bazel-bin/book_openener/book_openener.size.txt
            bazel-bin/book_openener/THIRD_PARTY_NOTICES.txt
            bazel-bin/book_openener/enclosure/*.stl
          if-no-files-found: error
