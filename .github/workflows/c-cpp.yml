name: C/C++ CI

'on': push: branches: - main pull_request: branches: - main

permissions: contents: read

jobs: build: runs-on: ubuntu-latest

steps: - name: Checkout repository uses: actions/checkout@v4

- name: Install build utilities run: | sudo apt-get update sudo apt-get install -y cmake ninja-build git python3 curl xz-utils

- name: Install Arm GNU Toolchain shell: bash run: | set -euo pipefail

VERSION="15.2.rel1" ARCHIVE="arm-gnu-toolchain-VERSION−x8664−arm−none−eabi.tar.xz"URL="https://developer.arm.com/−/media/Files/downloads/gnu/{VERSION}/binrel/ARCHIVE"DEST="{RUNNER_TEMP}/arm-toolchain"

mkdir -p "DEST"curl−fL−−retry3"URL" -o "RUNNERTEMP/{ARCHIVE}" tar -xJf "RUNNERTEMP/{ARCHIVE}" -C "$DEST"

TOOLCHAINDIR="(find"DEST" -mindepth 1 -maxdepth 1 -type d -name 'arm-gnu-toolchain-' -print -quit)" test -n "TOOLCHAINDIR"test−x"TOOLCHAIN_DIR/bin/arm-none-eabi-gcc"

echo "PICOTOOLCHAINPATH=TOOLCHAINDIR">>"GITHUBENV" echo "TOOLCHAINDIR/bin">>"GITHUBPATH"

"$TOOLCHAIN_DIR/bin/arm-none-eabi-gcc" --version

- name: Configure CMake run: | cmake -S . -B build -G Ninja
-DPICOSDKFETCHFROMGIT=ON
-DPICOSDKFETCHFROMGITTAG=2.3.1
-DPICOBOARD=pico2_w

- name: Build firmware run: cmake --build build --parallel 2

- name: Upload firmware uses: actions/upload-artifact@v4 with: name: pico2-w-firmware path: | build/lightturret.uf2 build/lightturret.elf build/light_turret.bin if-no-files-found: warn